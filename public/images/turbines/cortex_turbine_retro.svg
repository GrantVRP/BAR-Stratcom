<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19 -19 38 38" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="cortexBladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <!-- Nacelle Mechanical Head & Top Sensor Vane (Backing) -->
  <polygon points="-3.5,-2.5 3.5,-2.5 3.5,2.5 -3.5,2.5" fill="#27272a" stroke="#3f3f46" stroke-width="0.5" />
  <polygon points="-0.5,-7.5 0.5,-7.5 0.5,-2.5 -0.5,-2.5" fill="#71717a" />

  <!-- Blade 1 (North: 0 deg) -->
  <g>
    <polygon points="-1.5,0 -1.9,-13 -0.5,-16.5 1.5,-15 1.9,-12 1.2,0" fill="url(#cortexBladeGrad)" stroke="#18181b" stroke-width="0.4" />
    <line x1="0" y1="0" x2="0.5" y2="-15.5" stroke="#71717a" stroke-width="0.6" />
    <line x1="-0.5" y1="-16.5" x2="1.5" y2="-15" stroke="#e4e4e7" stroke-width="0.7" />
  </g>

  <!-- Blade 2 (120 deg) -->
  <g transform="rotate(120)">
    <polygon points="-1.5,0 -1.9,-13 -0.5,-16.5 1.5,-15 1.9,-12 1.2,0" fill="url(#cortexBladeGrad)" stroke="#18181b" stroke-width="0.4" />
    <line x1="0" y1="0" x2="0.5" y2="-15.5" stroke="#71717a" stroke-width="0.6" />
    <line x1="-0.5" y1="-16.5" x2="1.5" y2="-15" stroke="#e4e4e7" stroke-width="0.7" />
  </g>

  <!-- Blade 3 (240 deg) -->
  <g transform="rotate(240)">
    <polygon points="-1.5,0 -1.9,-13 -0.5,-16.5 1.5,-15 1.9,-12 1.2,0" fill="url(#cortexBladeGrad)" stroke="#18181b" stroke-width="0.4" />
    <line x1="0" y1="0" x2="0.5" y2="-15.5" stroke="#71717a" stroke-width="0.6" />
    <line x1="-0.5" y1="-16.5" x2="1.5" y2="-15" stroke="#e4e4e7" stroke-width="0.7" />
  </g>

  <!-- Iconic Cortex RED Hexagonal Gear Hub -->
  <polygon points="0,-3.2 2.8,-1.6 2.8,1.6 0,3.2 -2.8,1.6 -2.8,-1.6" fill="#dc2626" stroke="#991b1b" stroke-width="0.5" />
  <polygon points="0,-2.0 1.7,-1.0 1.7,1.0 0,2.0 -1.7,1.0 -1.7,-1.0" fill="#ef4444" />
  <circle cx="0" cy="0" r="0.8" fill="#18181b" />
</svg>
